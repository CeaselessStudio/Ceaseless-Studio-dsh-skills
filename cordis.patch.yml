# Bundle layer: one loader row for the plugin.
# Каталог скиллов берётся из ctx.skills, поэтому дополнительных путей настраивать
# не нужно. Опционально: cwd (строка или список) - где искать проектные скиллы,
# ttlMs - сколько миллисекунд держать кэш каталога (по умолчанию 30 с).
- insert:
    - id: skills-panel
      name: '@local/dsh-skills'
